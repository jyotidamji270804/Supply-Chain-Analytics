name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python data/generate_data.py

      - name: Run test suite
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t supply-chain-analytics .

      - name: Verify container starts and responds
        run: |
          docker run -d -p 8501:8501 --name test-container supply-chain-analytics
          sleep 15
          curl -sf http://localhost:8501/_stcore/health || (docker logs test-container && exit 1)
          docker stop test-container